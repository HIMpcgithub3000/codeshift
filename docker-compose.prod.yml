version: '3.8'

services:
  codeshift-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeshift_app
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
    volumes:
      - ./migrations:/app/migrations
      - ./output:/app/output
      - ./logs:/app/logs
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: codeshift_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      codeshift-app:
        condition: service_healthy
